# ══════════════════════════════════════════════════════════════════════════════
#  INFOSISTEL v2 — Nginx Configuration
#  Adaptado del sitio anterior (mismo dominio, mismo puerto 3000 — nginx no
#  le importa qué app corre detrás). Tres cambios reales sobre el original:
#    1. El rate-limit estricto de login apunta a /taller-control/login (Server
#       Action de v2), no a /api/auth/login (endpoint REST que v2 no tiene).
#    2. Se quitaron las cabeceras de seguridad duplicadas — v2 las pone a
#       nivel de app (next.config.ts + src/proxy.ts), con nonce por
#       request en la CSP que nginx no puede generar. Ver la nota en la
#       sección de headers más abajo.
#    3. Se agregó `location /img/products/` sirviendo directo desde
#       PRODUCT_IMAGES_DIR (alias). El servidor standalone de Next.js
#       indexa public/ una sola vez al arrancar y no ve archivos escritos
#       después — una foto de producto subida en caliente devolvía 404
#       hasta el próximo reinicio del proceso. Ver hardening-log.md #28.
#  Hardening Anti-DDoS (revisión 2)
# ══════════════════════════════════════════════════════════════════════════════

# ── Rate Limiting Zones ──────────────────────────────────────────────────────
# [D-03] Zona dedicada para /api/ — primer filtro antes de llegar a Node.js
limit_req_zone $binary_remote_addr zone=api_strict_zone:10m  rate=30r/m;
# Login: max 5 req/min por IP (fuerza bruta)
limit_req_zone $binary_remote_addr zone=login_zone:10m       rate=5r/m;
# API general: max 60 req/min por IP
limit_req_zone $binary_remote_addr zone=api_zone:10m         rate=60r/m;
# Páginas públicas: max 120 req/min por IP
limit_req_zone $binary_remote_addr zone=general_zone:20m     rate=120r/m;

# ── Connection Limiting Zones ────────────────────────────────────────────────
# [D-01] Máximo de conexiones SIMULTÁNEAS por IP
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
# Máximo de conexiones simultáneas al servidor completo
limit_conn_zone $server_name zone=conn_per_server:10m;

# ── Status codes para rate limit / conn limit ────────────────────────────────
limit_req_status  429;
limit_conn_status 429;

# ── Log format con info de rate limiting ─────────────────────────────────────
log_format ddos_log '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time rl=$limit_req_status';

upstream nextjs_upstream {
    server localhost:3000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name infosistel.com.pe www.infosistel.com.pe;

    # [D-02] Timeouts rápidos en HTTP también (Slowloris en plain HTTP)
    client_header_timeout 10s;
    client_body_timeout   10s;

    # Let's Encrypt HTTP-01: debe quedar en puerto 80 SIN redirigir a HTTPS.
    # Si el certificado ya venció, Certbot no puede validar por 443.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS principal ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name infosistel.com.pe www.infosistel.com.pe;

    # ── SSL Certificates (Certbot) ──
    ssl_certificate           /etc/letsencrypt/live/infosistel.com.pe/fullchain.pem;
    ssl_certificate_key       /etc/letsencrypt/live/infosistel.com.pe/privkey.pem;

    # ── SSL Hardening ──
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # ── MIME Types ──
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logs ──
    access_log /var/log/nginx/infosistel_access.log ddos_log;
    error_log  /var/log/nginx/infosistel_error.log warn;

    # ── Hide Nginx version ──
    server_tokens off;

    # ── [D-01] Límite de conexiones simultáneas por IP ──
    # Un browser normal abre máx ~6-8 conexiones. 20 es generoso pero bloquea floods.
    limit_conn conn_per_ip     20;
    limit_conn conn_per_server 500;

    # ── [D-02] Timeouts anti-Slowloris ──
    # Slowloris envía headers muy lentamente para mantener conexiones abiertas.
    # Con estos timeouts, nginx cierra conexiones lentas en 10-15 segundos.
    client_header_timeout  10s;
    client_body_timeout    10s;
    send_timeout           15s;
    keepalive_timeout      30s;

    # ── [H-02] Limitar requests por conexión keepalive ──
    # Sin este límite, una conexión keepalive puede enviar millones de requests.
    keepalive_requests 100;

    # ── Request body size limit (5MB max for product images) ──
    client_max_body_size 5M;

    # ── [D-02] Proxy timeouts ──
    # Si Node.js tarda más de 90s en responder, nginx corta la conexión.
    # Esto evita que workers nginx queden bloqueados por requests maliciosos.
    # Subido de 30s a 90s (entrada #34 y #36 de hardening-log.md):
    # "Reconocer con IA" encadena una llamada de visión + una búsqueda de
    # imágenes que en el mundo real puede superar 30s. Un location block
    # separado solo para /taller-control/ causó un loop de redirecciones
    # en producción (no coincidía con la ruta exacta /taller-control sin
    # slash final, así que esa petición seguía cayendo en el bloque
    # genérico con un timeout distinto — la causa real del loop no se
    # terminó de aislar, y revertir a un único valor global fue la
    # corrección más segura). Más permisivo para todo el sitio que antes,
    # pero sigue siendo un límite acotado, no indefinido.
    proxy_connect_timeout  10s;
    proxy_read_timeout     90s;
    proxy_send_timeout     90s;

    # ── Gzip Compression ──
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── Security headers: intentionally NOT set here ──
    # v2's app layer owns all of these (next.config.ts headers() +
    # src/proxy.ts for the nonce-based CSP) — X-Frame-Options DENY,
    # Permissions-Policy scoped per-route, HSTS, and a CSP with a fresh
    # per-request nonce nginx has no way to generate. Duplicating any of
    # these here would send two copies of the same header with DIFFERENT
    # values (e.g. this file's old X-Frame-Options: SAMEORIGIN vs. the
    # app's DENY) — undefined/inconsistent behavior across browsers, and a
    # real way to end up LESS protected than the app alone. If nginx ever
    # needs to add something app-level here again, remove the matching
    # header from next.config.ts first so there's exactly one source.

    # ── Block access to sensitive files ──
    location ~ /\.(env|git|sh|sql|log)$ { deny all; return 404; }

    # ── [H-03] Bloquear User-Agents vacíos ──
    # Los bots más simples y los flood tools básicos no envían User-Agent.
    # Los browsers siempre envían uno.
    if ($http_user_agent = "") {
        return 444;  # Nginx cierra la conexión sin respuesta (más eficiente que 403)
    }

    # ── [H-03] Bloquear herramientas de DDoS/scraping conocidas ──
    # Estas no son browsers legítimos. Si aparecen, son ataques o scraping agresivo.
    if ($http_user_agent ~* "(masscan|nikto|sqlmap|nmap|acunetix|dirbuster|gobuster|hydra|zgrab|python-requests/2\.2[0-9]|go-http-client/1\.1)") {
        return 444;
    }

    # ── [H-method] Whitelist de métodos HTTP ──
    # Métodos legítimos: GET, POST, HEAD para frontend; DELETE, PATCH para API admin.
    # TRACE, CONNECT, OPTIONS (sin CORS needed), PUT → bloqueados.
    if ($request_method !~ ^(GET|POST|HEAD|DELETE|PATCH)$) {
        return 405;
    }

    # ── Login: rate limit más estricto ──
    # v2 usa un Server Action (POST directo a /taller-control/login, no un endpoint
    # REST bajo /api/) — a diferencia del sitio anterior, así que esta regla
    # apunta ahí. Debe ir antes que cualquier bloque más genérico que
    # también matchee /taller-control (prefijo más largo gana en nginx).
    location = /taller-control/login {
        limit_req zone=login_zone burst=3 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Fotos de producto: servidas por nginx directo, nunca por Node ──
    # PRODUCT_IMAGES_DIR vive fuera del repo (docs/deploy-vps.md) y
    # .next/standalone/public/img/products/ es un symlink hacia ahí — pero
    # el servidor standalone de Next.js indexa su carpeta public/ una sola
    # vez al arrancar y NO detecta archivos escritos después (confirmado:
    # una foto subida en caliente devuelve 404 hasta el próximo reinicio
    # del proceso). nginx sí lee el filesystem en cada request, así que
    # sirviendo esta ruta directo desde disco se evita el problema por
    # completo — y de paso ya no pasa por Node para esto.
    # IMPORTANTE: esta ruta debe coincidir exactamente con
    # PRODUCT_IMAGES_DIR en el .env real del VPS.
    location /img/products/ {
        alias /home/zarate/infosistel-v2-data/uploads/products/;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # ── [D-03] Rate limit en /api/ a nivel nginx ──
    # Primera barrera antes de llegar a Node.js. burst=10 permite ráfagas legítimas.
    location /api/ {
        limit_req zone=api_strict_zone burst=10 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Proxy a Next.js (páginas públicas) ──
    location / {
        limit_req zone=general_zone burst=30 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
