# ══════════════════════════════════════════════════════════════════════════════
#  INFOSISTEL v2 — Nginx para el LABORATORIO (infosistel.lab)
# ══════════════════════════════════════════════════════════════════════════════
#  Copia fiel de nginx.conf de producción, con cuatro cambios deliberados:
#    1. server_name = infosistel.lab (dominio del lab, no el real).
#    2. Certificado propio (/etc/nginx/ssl) en vez de Let's Encrypt.
#    3. Sin bloque ACME de certbot (no hay Internet ni CA pública en el lab).
#    4. Rutas de uploads parametrizadas con __DATA_DIR__.
#
#  Las cabeceras de seguridad (HSTS, CSP con nonce, X-Frame-Options, etc.)
#  NO se ponen aquí: las emite la app (next.config.ts + src/proxy.ts), igual
#  que en producción. Duplicarlas produciría dos valores distintos.
#
#  Este archivo lo instala scripts/lab/vps/04-desplegar-app.sh, que reemplaza
#  __DOMAIN__ y __DATA_DIR__ antes de copiarlo a /etc/nginx/sites-available/.
# ══════════════════════════════════════════════════════════════════════════════

# ── Rate Limiting Zones ──────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_strict_zone:10m  rate=60r/m;
limit_req_zone $binary_remote_addr zone=general_zone:20m     rate=300r/m;

# ── Connection Limiting Zones ────────────────────────────────────────────────
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_conn_zone $server_name        zone=conn_per_server:10m;

limit_req_status  429;
limit_conn_status 429;

log_format lab_ddos_log '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time rl=$limit_req_status';

upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_header_timeout 10s;
    client_body_timeout   10s;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS principal ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__ www.__DOMAIN__;

    ssl_certificate     /etc/nginx/ssl/__DOMAIN__.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/__DOMAIN__.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    default_type application/octet-stream;

    access_log /var/log/nginx/infosistel-lab_access.log lab_ddos_log;
    error_log  /var/log/nginx/infosistel-lab_error.log warn;

    # ── Ocultar versión de Nginx ──
    server_tokens off;

    # ── [D-01] Límite de conexiones simultáneas ──
    limit_conn conn_per_ip     100;
    limit_conn conn_per_server 1000;

    # ── [D-02] Timeouts anti-Slowloris ──
    client_header_timeout  10s;
    client_body_timeout    10s;
    send_timeout           15s;
    keepalive_timeout      30s;
    keepalive_requests     100;

    client_max_body_size 10M;

    proxy_connect_timeout  10s;
    proxy_read_timeout     90s;
    proxy_send_timeout     90s;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── Archivos sensibles ──
    # Nota: esta regla es la misma de producción. Solo bloquea si el URI
    # termina en .env/.git/.sh/.sql/.log; /.git/config lo resuelve Next con
    # 404. La versión ideal (location ~ /\.(?!well-known)) está anotada como
    # hallazgo en scripts/lab/README.md §10.
    location ~ /\.(env|git|sh|sql|log)$ { deny all; return 404; }

    # ── [H-04] Filtro Anti-SQLi ──
    # Inspecciona el query string crudo ($query_string), por eso sí detecta
    # los espacios codificados como %20 (a diferencia del filtro de la app,
    # que recibe el query normalizado con '+' — ver README §10).
    if ($query_string ~* "(union.*select|insert.*into|drop.*table|update.*set|delete.*from|information_schema|benchmark\(|sleep\(|waitfor.*delay|load_file|outfile|<script)") {
        return 403;
    }

    # ── [H-03] User-Agent vacío ──
    if ($http_user_agent = "") {
        return 444;
    }

    # ── [H-03] Herramientas de escaneo conocidas ──
    if ($http_user_agent ~* "(masscan|nikto|sqlmap|nmap|acunetix|dirbuster|gobuster|hydra|zgrab|python-requests/2\.2[0-9]|go-http-client/1\.1)") {
        return 444;
    }

    # ── Whitelist de métodos HTTP ──
    if ($request_method !~ ^(GET|POST|HEAD|DELETE|PATCH)$) {
        return 405;
    }

    # ── Fotos persistentes (fuera del repo) ──
    location ^~ /img/products/ {
        alias __DATA_DIR__/uploads/products/;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        error_page 403 404 = @nextjs_fallback;
    }

    location ^~ /img/servicios/ {
        alias __DATA_DIR__/uploads/servicios/;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        error_page 403 404 = @nextjs_fallback;
    }

    location ^~ /img/cotizaciones/ {
        alias __DATA_DIR__/uploads/cotizaciones/;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        error_page 403 404 = @nextjs_fallback;
    }

    location @nextjs_fallback {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── [D-03] Rate limit en /api/ ──
    location /api/ {
        limit_req zone=api_strict_zone burst=20 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Assets de Next.js (sin rate limit, caché inmutable) ──
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Estáticos generales ──
    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|woff2?|ttf|eot)$ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        access_log off;
    }

    # ── Proxy a Next.js ──
    location / {
        limit_req zone=general_zone burst=80 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
